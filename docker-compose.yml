services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vending
      POSTGRES_USER: vending
      POSTGRES_PASSWORD: vending
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
