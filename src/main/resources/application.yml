spring:
  application:
    name: corporate-vending-machine
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

vending:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:vending-backend}
  order:
    payment-timeout-seconds: 120
    dispense-timeout-seconds: 20
    watchdog-interval-ms: 5000
  gateway:
    upi:
      base-url: ${UPI_BASE_URL:http://localhost:9091}
      api-key: ${UPI_API_KEY:dev-upi-key}
      webhook-secret: ${UPI_WEBHOOK_SECRET:dev-webhook-secret-change-me}
    card:
      base-url: ${CARD_BASE_URL:http://localhost:9092}
      api-key: ${CARD_API_KEY:dev-card-key}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-secret}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/vending
    username: vending
    password: vending
  flyway:
    locations: classpath:db/migration,classpath:db/seed
logging:
  level:
    com.corporate.vending: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  flyway:
    locations: classpath:db/migration
vending:
  security:
    jwt-secret: ${JWT_SECRET}
  gateway:
    upi:
      webhook-secret: ${UPI_WEBHOOK_SECRET}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: INFO
